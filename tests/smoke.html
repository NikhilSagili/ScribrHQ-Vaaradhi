<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Demo smoke tests</title>
<style>body{font:14px/1.5 ui-monospace,Consolas,monospace;margin:16px}#out .FAIL{color:#b00020;font-weight:700}#out .PASS{color:#0a6b2f}#out .SECTION{list-style:none;font-weight:700;margin-top:10px}iframe{width:1400px;height:900px;border:1px solid #ccc}</style>
</head>
<body>
<h1>Demo smoke tests</h1>
<p>Open with a local server (<code>python -m http.server</code>, then /tests/smoke.html), or headless Chrome with <code>--allow-file-access-from-files</code>. Works in the public demo and in the local meeting copy. The app's saved state is reset before and after the run.</p>
<div id="summary">running…</div>
<ol id="out"></ol>
<iframe id="f" title="App under test"></iframe>
<script>
const results = [];
const out = document.getElementById('out');
function check(ok, msg){ results.push(!!ok); const li = document.createElement('li'); li.className = ok ? 'PASS' : 'FAIL'; li.textContent = (ok ? 'PASS ' : 'FAIL ') + msg; out.appendChild(li); }
function section(t){ const li = document.createElement('li'); li.className = 'SECTION'; li.textContent = '— ' + t; out.appendChild(li); }
const frame = document.getElementById('f');
const wait = ms => new Promise(r => setTimeout(r, ms));
function load(){ return new Promise(res => { frame.onload = () => res(); frame.src = '../index.html?t=' + Date.now(); }); }
const TIME_CLAIMS = /\b45\s*(min|mins)\b|\b6:30\b|\b7 ?AM\b|\b20 min\b|\b5:00 AM\b|\b6:00 AM\b|\b8:00 AM\b/i;

(async () => {
  const errors = [];
  await load();
  let w = frame.contentWindow, d = w.document;
  try { w.localStorage.clear(); } catch(e) {}
  await load(); w = frame.contentWindow; d = w.document;
  const hook = win => { win.addEventListener('error', e => errors.push(e.message)); const ce = win.console.error; win.console.error = (...a) => { errors.push('console.error: ' + a.join(' ')); ce.apply(win.console, a); }; };
  hook(w);
  const ev = x => w.eval(x);
  const $ = (sel, root) => (root || d).querySelector(sel);
  const $$ = (sel, root) => [...(root || d).querySelectorAll(sel)];
  const click = sel => { const el = $(sel); if (!el) throw new Error('missing ' + sel); el.click(); };
  const act = (a, v) => { const b = d.createElement('button'); b.dataset.a = a; if (v != null) b.dataset.v = v; d.body.appendChild(b); b.click(); b.remove(); };
  const type = (id, val) => { const el = d.getElementById(id); el.value = val; el.dispatchEvent(new w.Event('input', {bubbles:true})); };
  const custText = () => $('#custApp').textContent;
  const BRAND = w.DEMO_CONFIG.assetMode === 'brand';

  try {
    section(`Configuration (${BRAND ? 'LOCAL MEETING COPY, brand assets' : 'PUBLIC demo, placeholders'})`);
    const cat = w.CATALOGUE;
    check(cat && cat.products.length === 50, `catalogue has 50 products (got ${cat && cat.products.length})`);
    const ids = cat.products.map(p => p.id);
    check(new Set(ids).size === ids.length, 'product ids are unique');
    check(cat.products.every(p => typeof p.price === 'number' && p.price > 0), 'every product has a positive price');
    check(cat.products.every(p => cat.categories.some(c => c.id === p.category)), 'every product category exists');
    check(cat.products.every(p => p.source && p.source.channel === 'EkSecond' && p.source.verifiedOn === '2026-10-28'), 'every product records source EkSecond and verification date');
    check(cat.products.every(p => p.subscription && p.subscription.status === 'proposed-default'), 'eligibility is marked as proposed default on every product');
    check(!cat.products.every(p => p.subscription.eligible), 'not every product is subscription-eligible');
    check(w.MEAL_PLANS && w.MEAL_PLANS.plans.every(p => p.menu === null && p.pricePerServing === null && p.status === 'concept'), 'meal plans are concepts with no menu or price');
    check(w.DEMO_CONFIG.subscriptionCutoff === '21:00' && ev('CUTOFF') === '9 PM', `provisional cutoff comes from config (${w.DEMO_CONFIG.subscriptionCutoff} → ${ev('CUTOFF')})`);
    if (BRAND) check(w.DEMO_CONFIG.brandAssets.logo && Object.keys(w.DEMO_CONFIG.brandAssets.productImages).length > 0, 'meeting copy has logo and product photos configured');
    else check(w.DEMO_CONFIG.assetMode === 'placeholder' && !w.DEMO_CONFIG.brandAssets.logo, 'public build uses placeholder assets and no logo');

    section('Home');
    check(ev('ui.cTab') === 'home', 'customer app opens on Home');
    check(custText().includes('Healthy habits, made easier.'), 'hero message is shown');
    const entries = $$('#custApp .entries .entry').map(b => b.dataset.v);
    check(JSON.stringify(entries) === JSON.stringify(['meals','shop','orders']), `three entry points: Healthy Meal Plans, Shop Groceries, Order Again (${entries})`);
    check(/Healthy Meal Plans/.test(custText()) && /Shop Groceries/.test(custText()) && /Order Again/.test(custText()), 'entry point labels are visible');
    check($$('#custApp .rail .pc').length === w.DEMO_CONFIG.homeEssentials.length, `everyday essentials row shows ${w.DEMO_CONFIG.homeEssentials.length} catalogue products`);
    check($$('#custApp .catgrid .cg').length === 16, 'category grid shows all 16 categories');
    check(!$('#custApp .hb') && $$('#custApp .sec-h').length === 2, 'old long list of category rows is gone');
    check(!!$('#custApp .tstrip'), 'tomorrow strip links to the schedule');

    section('Navigation');
    for (const [tab, head] of [['shop','Shop groceries'],['orders','Orders'],['sched','Your schedule'],['wallet','Wallet'],['home','Healthy habits']]){
      click(`#custApp .nav [data-v="${tab}"]`);
      check(ev('ui.cTab') === tab && custText().includes(head), `bottom nav opens ${tab}`);
    }
    click('#custApp .entries [data-v="meals"]');
    check(ev('ui.cTab') === 'meals' && $$('#custApp .mp').length === 4, 'Healthy Meal Plans entry opens the concept preview with 4 plans');
    click('#custApp .back');
    check(ev('ui.cTab') === 'home', 'back button returns to Home');
    click('#custApp .entries [data-v="orders"]');
    check(ev('ui.cTab') === 'orders' && custText().includes('Saved baskets'), 'Order Again entry opens saved baskets and previous orders');
    act('ctab', 'home'); click('#custApp .sfake');
    check(ev('ui.cTab') === 'shop' && d.activeElement && d.activeElement.id === 'q', 'Home search opens Shop with the search box focused');

    section('Shop, search and categories');
    act('clear-filters');
    const cards = $$('#custApp .pc');
    check(cards.length === 50, `Shop shows all 50 products (got ${cards.length})`);
    let priceOk = true;
    cards.forEach(c => { const name = c.querySelector('.pc-name').textContent.trim(); const p = cat.products.find(x => x.name === name); const shown = c.querySelector('.pc-row b').textContent.replace(/[₹,]/g, ''); if (!p || +shown !== p.price) priceOk = false; });
    check(priceOk, 'every card price matches the catalogue');
    const eligibleNow = ev('PRODUCTS.filter(p => subFreqs(p).length).length');
    check($$('#custApp .pc-sub[data-a="buy-open"]').length === eligibleNow, `Subscribe only on products the engine can schedule (${eligibleNow})`);
    check($$('#custApp .pc-sub.off').length === 50 - eligibleNow, 'other products are labelled one-time purchase');
    if (BRAND) check($$('#custApp .pc-img img').length === Object.keys(w.DEMO_CONFIG.brandAssets.productImages).length, 'meeting copy shows a photo for every product that has one');
    else check($$('#custApp img').length === 0, 'public demo shows no product photos or logo');
    type('q', 'oil');
    let hits = $$('#custApp .pc-name').map(x => x.textContent);
    check(hits.length === 6 && hits.every(h => /oil/i.test(h)), `search "oil" returns the 6 oils (got ${hits.length})`);
    type('q', 'zzz');
    check(!!$('#custApp .empty') && !!$('#custApp .empty [data-a="clear-filters"]'), 'no-match search shows an empty state with a way out');
    click('#custApp .empty [data-a="clear-filters"]');
    check($$('#custApp .pc').length === 50 && ev('ui.q') === '', 'clearing restores all products');
    click('#custApp .cchip[data-v="Millets"]');
    check($$('#custApp .pc').length === 3, 'Millets chip shows 3 products');
    click('#custApp .fchip');
    check($$('#custApp .pc').length === 3, 'Millets + Can subscribe keeps all 3 millets (weekly plans are supported)');
    click('#custApp .cchip[data-v="Pickles & Podis"]');
    check($$('#custApp .pc').length === 0 && !!$('#custApp .empty'), 'Pickles + Can subscribe shows the empty state (pickles are one-time purchases)');
    click('#custApp .cchip[data-v="All"]');
    check($$('#custApp .pc').length === eligibleNow, '"Can subscribe" filter alone shows the eligible products');
    click('#custApp .fchip');
    act('ctab', 'home'); click('#custApp .cg[data-v="Pulses & Dals"]');
    check(ev('ui.cTab') === 'shop' && $$('#custApp .pc').length === 6, 'Home category tile opens Shop filtered to that category');
    act('clear-filters');

    section('Product details');
    act('buy-open', 'desi-eggs-6-pcs|now');
    check(/Desi Eggs/.test($('#custApp .sheet').textContent) && /₹150/.test($('#custApp .sheet').textContent) && /Eggs/.test($('#custApp .ps-cat').textContent), 'product sheet shows name, category and EkSecond price');
    check(!!$('#custApp .modes [data-v="sub"]'), 'eligible product offers Subscribe');
    click('#custApp .modes [data-v="tmr"]');
    check($('#custApp .sheet').textContent.includes(ev('fmtD(TMR)')), 'Tomorrow option names the next delivery date, without a time slot');
    act('close');
    act('buy-open', 'mango-pickle-300-g|sub');
    check(ev('ui.sheet.mode') === 'now' && !$('#custApp .modes [data-v="sub"]') && /one-time purchase/.test($('#custApp .sheet').textContent), 'non-eligible product has no Subscribe option');
    act('close');
    act('buy-open', 'apple-500-g|sub');
    const freqBtns = $$('#custApp [data-a="s-freq"]').map(b => b.dataset.v);
    check(JSON.stringify(freqBtns) === JSON.stringify(['alternate','days','weekly']), `apple offers only its proposed, supported frequencies (${freqBtns})`);
    act('close');

    section('Cart, saved basket and checkout');
    act('ctab', 'shop');
    act('cq', 'sunflower-oil-1-litre|1'); act('cq', 'sunflower-oil-1-litre|1'); act('cq', 'desi-eggs-6-pcs|1');
    check(ev('orderAmt(S.cart)') === 495*2 + 150, `cart total 2 × ₹495 + ₹150 = ₹1,140 (got ${ev('orderAmt(S.cart)')})`);
    check(/₹1,140/.test($('#custApp .cartbar').textContent), 'cart bar shows ₹1,140');
    act('cq', 'desi-eggs-6-pcs|-1');
    check(ev('S.cart.length') === 1 && ev('orderAmt(S.cart)') === 990, 'removing the last unit drops the item');
    act('cq', 'desi-eggs-6-pcs|1');
    click('#custApp .cartbar');
    check(ev('ui.sheet.type') === 'cart' && $$('#custApp .sheet .row').length === 2, 'cart sheet lists both items');
    check(/Demo/.test($('#custApp .sheet').textContent) && /Same-day delivery/.test($('#custApp .sheet').textContent), 'cart shows same-day delivery and a Demo label on payment');
    type('bname', 'Weekly basics');
    click('#custApp [data-a="save-basket"]');
    check(ev('S.baskets.length') === 2 && ev('S.baskets[1].name') === 'Weekly basics' && ev('orderAmt(S.baskets[1].items)') === 1140, 'cart saved as basket "Weekly basics" (₹1,140)');
    act('cart-open');
    const ordersBefore = ev('S.orders.length');
    click('#custApp [data-a="place"]');
    check(ev('S.orders.length') === ordersBefore + 1, 'placing the order creates one order');
    const last = ev('S.orders[S.orders.length-1]');
    check(last.amt === 1140 && last.status === 'placed' && last.date === ev('TDY'), 'new order is ₹1,140, dated today, awaiting acceptance');
    check(ev('S.ledger.some(l => l.amt === -1140)'), 'wallet records a ₹1,140 debit');
    check(ev('ui.cTab') === 'orders' && /Waiting for Vaaradhi/.test(custText()), 'customer lands on Orders with live tracking');
    check($('#merchApp').textContent.includes('#' + last.id), 'merchant Orders tab shows the new order');
    act('oadv', String(last.id));
    check(ev(`S.orders.find(o => o.id === ${last.id}).status`) === 'accepted' && /Order accepted/.test(custText()), 'merchant accepts and the customer tracker updates');

    section('Order Again');
    act('ctab', 'orders');
    check($$('#custApp .bk').length === 2, 'two saved baskets listed');
    check($$('#custApp [data-a="reorder"]').length === 2, 'two previous orders with Reorder');
    click('#custApp [data-a="basket-cart"][data-v="b1"]');
    check(ev('ui.sheet.type') === 'cart' && ev('orderAmt(S.cart)') === ev("orderAmt(S.baskets.find(b => b.id === 'b1').items)"), 'one tap adds the saved basket to the cart with matching total');
    ev('S.cart = []'); act('close');
    click('#custApp [data-a="reorder"][data-v="1024"]');
    check(JSON.stringify(ev('S.cart')) === JSON.stringify(ev('S.orders.find(o => o.id === 1024).items')), 'Reorder copies the previous order into the cart');
    ev('S.cart = []'); act('close');
    click('#custApp [data-a="del-basket"]');
    check(ev('S.baskets.length') === 2 && /Tap to delete/.test(custText()), 'deleting a basket asks for a second tap');
    click('#custApp [data-a="del-basket"]');
    check(ev('S.baskets.length') === 1, 'second tap deletes the basket');

    section('Healthy Meal Plans (concept)');
    act('ctab', 'meals');
    const mps = $$('#custApp .mp');
    check(mps.length === 4 && mps.every(m => /Menu and pricing to be confirmed/.test(m.textContent)), 'all 4 plans say "Menu and pricing to be confirmed"');
    check(mps.every(m => !/₹/.test(m.textContent)), 'no prices on plan cards');
    check(/Concept preview/.test(custText()), 'screen is labelled as a concept preview');

    section('Breakfast concepts: customer interest');
    const intro = $('#custApp .mp-intro').textContent;
    check(intro.includes('Scribr proposes exploring flexible healthy-breakfast plans') && intro.includes('Menu, pricing and availability would be defined with Vaaradhi Farms'), 'approved "proposed by Scribr" wording is intact');
    const FOOD = /\b(idli|dosa|pongal|upma|poha|oats|smoothie|paratha|sandwich|salad|juice|porridge|granola|millet|ragi|protein|calorie|vitamin|nutritious|healthy for)\b/i;
    const snapState = () => JSON.stringify({subs:ev('S.subs.length'), orders:ev('S.orders.length'), ledger:ev('S.ledger.length'), lines:ev('lines()'), prep:ev('prep()'), stops:ev('stops().length'), rev:ev('dayRevenue(TDY).amt'), cart:ev('S.cart.length'), extras:ev('S.extras.length'), bal:ev('balance()')});
    const SAMPLES = w.DEMO_CONFIG.sampleInterest ? 8 : 0;
    const before = snapState(), sampleN = ev('S.mealSamples.length');
    check(sampleN === SAMPLES && ev('S.mealInterest.length') === 0, BRAND ? 'meeting copy: 8 illustrative samples, stored apart from customer submissions' : 'public demo: breakfast interest starts empty (no samples)');
    check(BRAND ? w.DEMO_CONFIG.sampleInterest === true : w.DEMO_CONFIG.sampleInterest === false, 'sample responses are on only in the meeting copy');
    act('mtab', 'interest');
    if (SAMPLES) check($$('#merchApp .ic-list .chip').filter(c => c.textContent === 'Sample').length === 8 && !/This demo/.test($('#merchApp .ic-list') ? $$('#merchApp .ic-list').map(x => x.textContent).join('') : ''), 'every sample is labelled "Sample" before anyone submits');
    else check(/No responses yet/.test($('#merchApp').textContent) && $$('#merchApp .ic-list').length === 0, 'public merchant interest screen starts empty and says so');
    act('mtab', 'home');
    for (const plan of w.MEAL_PLANS.plans){
      act('ctab', 'meals'); click(`#custApp [data-a="meal-open"][data-v="${plan.id}"]`);
      const sh = $('#custApp .sheet'), txt = sh.textContent;
      const sel = $$('#custApp .sheet [data-a="meal-day"]').filter(b => b.classList.contains('on')).map(b => +b.dataset.v).sort().join();
      const want = (plan.schedule === 'weekly' ? [plan.days[0]] : plan.days).slice().sort().join();
      check(sel === want, `${plan.name}: preferred days start from the concept's defaults (${sel})`);
      check(JSON.stringify($$('#custApp .sheet [data-a="meal-serv"]').map(b => +b.dataset.v)) === JSON.stringify(plan.servingsOptions), `${plan.name}: serving options come from data/plans.js`);
      check($$('#custApp .sheet .box.tbc .chip').length === 5 && /To be confirmed with Vaaradhi Farms/.test(txt), `${plan.name}: menu, price, portion, ingredients and availability shown as to be confirmed`);
      check(!/₹/.test(txt) && !FOOD.test(txt), `${plan.name}: no prices, dishes or health claims`);
      check(/not an order or a subscription/.test(txt), `${plan.name}: says it is not an order or subscription`);
      if (plan.schedule === 'weekly'){
        click('#custApp .sheet [data-a="meal-day"][data-v="3"]'); click('#custApp .sheet [data-a="meal-day"][data-v="5"]');
        check(JSON.stringify(ev('ui.sheet.days')) === '[5]', 'Weekly Healthy Mix: choosing a day replaces the previous one (one day a week)');
      }
      click('#custApp [data-a="meal-submit"]');
      check(ev('ui.sheet.done') === true && /Interest recorded/.test($('#custApp .sheet').textContent) && /This is not an order/.test($('#custApp .sheet').textContent), `${plan.name}: confirmation shown and says it is not an order`);
      act('close');
    }
    check(ev("S.mealInterest.filter(x => x.cust === 'me').length") === 4, 'one interest record per concept for the demo customer');
    check(snapState() === before, 'interest creates no plans, orders, charges, deliveries, prep items, revenue or cart items');
    check(ev("S.feed[0].kind") === 'interest' && /not an order/.test(ev("S.feed[0].text")), "merchant feed notes the interest as not an order");

    act('meal-open', 'healthy-start');
    [1,2,3,4,5,6].forEach(dd => { if (ev('ui.sheet.days').includes(dd)) click(`#custApp .sheet [data-a="meal-day"][data-v="${dd}"]`); });
    check(ev('ui.sheet.days.length') === 0 && $('#custApp [data-a="meal-submit"]').disabled && !!$('#custApp .sheet .info.warn'), 'with no day chosen, submitting is disabled and explained');
    click('#custApp .sheet [data-a="meal-preset"][data-v="2"]'); click('#custApp .sheet [data-a="meal-serv"][data-v="2"]');
    const nBefore = ev('S.mealInterest.length');
    click('#custApp [data-a="meal-submit"]');
    act('meal-submit'); act('meal-submit');
    check(ev('S.mealInterest.length') === nBefore, 'editing updates the existing record; repeated submits add nothing');
    const hs = ev("S.mealInterest.find(x => x.cust === 'me' && x.planId === 'healthy-start')");
    check(JSON.stringify(hs.days) === '[1,3,5]' && hs.servings === 2, 'Healthy Start updated to Mon, Wed, Fri · 2 servings');
    act('close'); act('meal-open', 'healthy-start');
    check($('#custApp [data-a="meal-submit"]').disabled && /already shared/.test($('#custApp .sh-foot').textContent), 'reopening with unchanged preferences blocks a duplicate submit');
    act('close');
    check(/Interest shared: Mon, Wed, Fri · 2 servings/.test(custText()), 'meal card shows the shared preferences');

    section('Breakfast concepts: delivery or pickup preference');
    act('meal-open', 'healthy-start');
    const fBtns = $$('#custApp .sheet [data-a="meal-ful"]').map(b => b.textContent);
    check(JSON.stringify(fBtns) === JSON.stringify(['Delivery','Pickup','Either / no preference']) && $$('#custApp .sheet [data-a="meal-ful"].on').length === 0, 'optional preference offers Delivery, Pickup, Either; nothing preselected');
    check(/DELIVERY OR PICKUP \(OPTIONAL\)/.test($('#custApp .sheet').textContent) && /Vaaradhi Farms would confirm which options, if any, can be offered/.test($('#custApp .sheet').textContent), 'preference is marked optional and subject to Vaaradhi confirming');
    click('#custApp .sheet [data-a="meal-ful"][data-v="pickup"]');
    check(!$('#custApp [data-a="meal-submit"]').disabled, 'changing only the preference counts as an update');
    click('#custApp [data-a="meal-submit"]');
    check(ev("myInterest('healthy-start').fulfil") === 'pickup' && ev("S.mealInterest.filter(x => x.planId === 'healthy-start').length") === 1, 'preference saved on the same record (no duplicate)');
    check(/Pickup \(a preference, to be confirmed by Vaaradhi\)/.test($('#custApp .sheet').textContent), 'confirmation shows the preference as to be confirmed');
    act('close');
    check(/Mon, Wed, Fri · 2 servings · Pickup/.test(custText()), 'meal card shows the preference');
    act('mtab', 'interest');
    const hsC = $('#merchApp .ic[data-plan="healthy-start"]').textContent;
    check(/Pickup · /.test(hsC) && /Ananya Rao.*Pickup/.test(hsC) && /to be confirmed by Vaaradhi/.test(hsC), 'merchant sees the preference, marked as to be confirmed');
    act('mtab', 'home'); act('ctab', 'meals');
    act('meal-open', 'healthy-start'); click('#custApp .sheet [data-a="meal-ful"][data-v="pickup"]');
    check(ev('ui.sheet.fulfil') === null, 'tapping the selected option clears it');
    click('#custApp [data-a="meal-submit"]'); act('close');
    check(ev("myInterest('healthy-start').fulfil") === null && /No delivery\/pickup preference/.test((act('mtab', 'interest'), $('#merchApp .ic[data-plan="healthy-start"]').textContent)), 'cleared preference shows as not given to the merchant');
    act('mtab', 'home'); act('ctab', 'meals');

    section('Breakfast concepts: merchant view');
    act('mtab', 'cust');
    check(new RegExp(`Breakfast plan interest · ${ev('allInterest().length')} responses`).test($('#merchApp').textContent), 'Customers tab links to breakfast interest with the response count');
    click('#merchApp .intcard');
    const mtxt = $('#merchApp').textContent;
    check(ev('ui.mTab') === 'interest' && /Proposed demand, not confirmed orders/.test(mtxt) && /not counted in Orders, Tomorrow, Run or Earnings/.test(mtxt), 'interest screen states it is proposed demand, not orders');
    for (const plan of w.MEAL_PLANS.plans){
      const card = $(`#merchApp .ic[data-plan="${plan.id}"]`), n = ev(`allInterest().filter(x => x.planId === '${plan.id}').length`);
      check(card && card.textContent.includes(`${n} interested`), `${plan.name}: ${n} responses shown`);
    }
    const hsCard = $('#merchApp .ic[data-plan="healthy-start"]');
    const monBar = +$$('.db', hsCard)[0].querySelector('em').textContent;
    check(monBar === ev("allInterest().filter(x => x.planId === 'healthy-start' && x.days.includes(1)).length"), 'preferred-day bars count the right responses (Monday)');
    check(/2 servings · /.test(hsCard.textContent) && /This demo/.test(hsCard.textContent) && (!SAMPLES || /Sample/.test(hsCard.textContent)), 'serving preferences and Sample / This demo labels are shown');
    check($$('#merchApp .ic-list .row').filter(r => /Ananya Rao/.test(r.textContent)).every(r => /This demo/.test(r.textContent)), 'customer submissions are labelled "This demo", never "Sample"');
    check(/Ananya Rao.*Mon, Wed, Fri · 2 servings/.test(hsCard.textContent), "the demo customer's submission appears with their days and servings");
    check(!/₹/.test(mtxt) && !FOOD.test(mtxt), 'merchant interest screen shows no prices or dishes');
    // Read the screens themselves; the live-update pop-up and the feed legitimately mention the interest.
    act('mtab', 'orders'); const ordTxt = $('#merchApp .body').textContent;
    act('mtab', 'today'); const tdTxt = $('#merchApp .body').textContent;
    act('mtab', 'run'); const runTxt = $('#merchApp .body').textContent;
    act('mtab', 'earn'); const earnTxt = $('#merchApp .body').textContent;
    check(!/Healthy Start|Workday Breakfast|Family Breakfast|Weekly Healthy/.test(ordTxt + tdTxt.replace(/Live updates[\s\S]*/, '') + runTxt + earnTxt), 'concepts never appear in merchant Orders, prep sheet, Run or Earnings');
    act('mtab', 'orders');

    section('Breakfast concepts: withdraw and refresh');
    act('ctab', 'meals'); click('#custApp [data-a="meal-withdraw"][data-v="weekly-healthy-mix"]');
    check(/Tap again to withdraw/.test(custText()) && ev("!!S.mealInterest.find(x => x.cust === 'me' && x.planId === 'weekly-healthy-mix')"), 'withdraw asks for a second tap');
    click('#custApp [data-a="meal-withdraw"][data-v="weekly-healthy-mix"]');

    const target = ev("planRows().find(r => r.group === 'active' && r.s.cust !== 'me' && delivers(r.s, TMR)).s");
    const prepT = ev(`prep()['${target.prod}'] || 0`), revY2 = ev('dayRevenue(plus(TDY, -1)).amt'), led2 = ev('S.ledger.length');
    act('mplan', target.id); click('#merchApp [data-a="mp-pause"]');
    check(ev(`S.subs.find(s => s.id === '${target.id}').pausedFrom`) === ev('TMR') && ev(`prep()['${target.prod}'] || 0`) === prepT - target.qty, 'merchant pause applies from tomorrow and updates the prep sheet');
    check(ev('dayRevenue(plus(TDY, -1)).amt') === revY2 && ev('S.ledger.length') === led2, "pausing doesn't rewrite past deliveries or charges");
    click('#merchApp [data-a="mp-resume"]');
    check(ev(`prep()['${target.prod}'] || 0`) === prepT, 'merchant resume restores it');
    click('#merchApp [data-a="mp-cancel"]');
    check(/Tap again to cancel/.test($('#merchApp .sheet').textContent) && !ev(`S.subs.find(s => s.id === '${target.id}').cancelledFrom`), 'merchant cancel asks for a second tap');
    click('#merchApp [data-a="mp-cancel"]');
    check(ev(`planStatus(S.subs.find(s => s.id === '${target.id}'))[0]`) === 'ended' && ev(`prep()['${target.prod}'] || 0`) === prepT - target.qty, 'cancelled plan shows as Ended and leaves tomorrow\'s prep sheet');
    act('mclose');
    const myPot = ev("activeSubs('me').find(s => s.prod === 'potato-500-g' && !s.cancelledFrom)");
    act('mplan', myPot.id); click('#merchApp [data-a="mp-pause"]');
    act('ctab', 'sched');
    check(new RegExp('Paused from ' + ev('fmtS(TMR)')).test(custText()), "a merchant pause shows in the customer's Schedule");
    act('mplan', myPot.id); click('#merchApp [data-a="mp-resume"]'); act('mclose');
    act('mtab', 'home');

    section('Subscriptions after the cutoff');
    act('lock'); check(ev('S.phase') === 'locked', 'cutoff passes (demo lock)');
    act('ctab', 'sched');
    act('t-skip', eggsSub);
    const next = ev(`nextEligible(S.subs.find(s => s.id === '${eggsSub}'))`);
    check(ev('ui.sheet && ui.sheet.type') === 'cutoff', 'after cutoff: skip shows the cutoff message instead');
    check($('#custApp .sheet').textContent.includes('closed at 9 PM') && $('#custApp .sheet').textContent.includes(ev(`fmtD('${next}')`)), `message names the cutoff and the next eligible date (${next})`);
    check(ev(`lines().find(l => l.subId === '${eggsSub}').status`) === 'ok', "tomorrow's delivery is unchanged");
    click('#custApp [data-a="skip-date"]');
    check(ev(`S.subs.find(s => s.id === '${eggsSub}').skips.includes('${next}')`) && /1 skipped/.test(custText()) && ev(`upcomingFor(S.subs.find(s => s.id === '${eggsSub}'), 6).find(u => u.date === '${next}').status`) === 'skipped', 'customer can skip the next eligible date instead');
    act('t-qty', eggsSub + '|1');
    check(ev('ui.sheet && ui.sheet.type') === 'cutoff' && ev(`lines().find(l => l.subId === '${eggsSub}').qty`) === 1, 'after cutoff: quantity change is blocked with the same message');
    act('close');

    const snap1 = JSON.stringify(ev('S.snapshot')); act('lock');
    check(JSON.stringify(ev('S.snapshot')) === snap1, 'locking twice does not rebuild or duplicate the list');
    act('manage', eggsSub);
    check(!!$('#custApp .sheet .chip.k') && /Being prepared/.test($('#custApp .sheet').textContent), "Manage shows tomorrow as being prepared");
    click(`#custApp [data-a="m-qty"][data-v="q|1"]`); click('#custApp [data-a="m-save"]');
    const eggV = ev("activeSubs('me').find(s => s.prod === 'desi-eggs-6-pcs' && s.freq === 'daily' && !s.cancelledFrom)");
    check(eggV.start === ev('DAT') && eggV.qty === 2 && ev(`lines().find(l => l.subId === '${eggsSub}').qty`) === 1, "after cutoff: a quantity change applies from the day after tomorrow; tomorrow is unchanged");
    check($('#custApp .sheet').textContent.includes('Your change starts ' + ev('fmtD(DAT)')), 'Manage states when the saved change starts');
    const upRows = $$('#custApp .sheet .row.up').map(r => r.textContent);
    check(upRows[0].includes(ev('fmtD(TMR)')) && /1 × Desi Eggs/.test(upRows[0]) && /Being prepared/.test(upRows[0]), 'upcoming list: tomorrow keeps 1, being prepared');
    check(upRows[1].includes(ev('fmtD(DAT)')) && /Skipped/.test(upRows[1]), 'upcoming list: the skip saved earlier for the day after is carried into the changed plan');
    check(/2 × Desi Eggs/.test(upRows[2]), 'upcoming list: deliveries after the change show the new regular quantity (2)');
    act('close');
    check(custText().includes('Change starts ' + ev('fmtS(DAT)')) && /Until .*: 1 × Daily/.test(custText()), 'Schedule row shows the change date and what applies until then');

    section('Merchant after the cutoff: status transitions and the run');
    act('mtab', 'orders'); act('of', 'date:all');
    const oo = ev("S.orders.find(o => o.date === TDY && o.status === 'placed')");
    if (oo){
      const seen = [];
      for (let i = 0; i < 4; i++){ const b = $(`#merchApp .ord[data-oid="${oo.id}"] [data-a="oadv"]`); if (!b) break; b.click(); seen.push(ev(`S.orders.find(o => o.id === ${oo.id}).status`)); }
      check(JSON.stringify(seen) === JSON.stringify(['accepted','packed','out','delivered']) && !$(`#merchApp .ord[data-oid="${oo.id}"] [data-a="oadv"]`), 'one-time order moves placed → accepted → packed → out → delivered, then has no further action');
    } else check(true, 'no new one-time order left to advance');
    act('of', 'date:tomorrow'); act('of', 'type:rec');
    check($$('#merchApp .ord').every(c => /Preparing/.test(c.textContent)), 'after the cutoff, recurring deliveries show as Preparing');
    const firstStop = ev("stops().find(s => s.cust !== 'me').cust");
    act('deliver', firstStop);
    check(/Delivered/.test($(`#merchApp .ord[data-oid="r-${firstStop}"]`).textContent), 'marking a stop delivered on the run updates its recurring order');
    check($$('#merchApp .ord').length === ev('stops().length'), 'Orders and the delivery run list the same stops');
    act('of', 'type:all'); act('of', 'date:today');
    act('mtab', 'today');
    const lockedPrep = JSON.stringify(ev('prep()'));
    const anyActive = ev("planRows().find(r => r.group === 'active' && delivers(r.s, TMR))");
    if (anyActive){ act('mp-pause', anyActive.s.id); check(JSON.stringify(ev('prep()')) === lockedPrep && ev(`S.subs.find(s => s.id === '${anyActive.s.id}').pausedFrom`) === ev('DAT'), 'after the cutoff, a merchant pause starts the day after; the locked prep sheet is unchanged'); act('mp-resume', anyActive.s.id); }
    act('ctab', 'orders'); click('#custApp [data-a="reorder"]');
    check(ev('S.cart.length') === 0, 'after cutoff: reorder is disabled (same-day ordering closed)');
    act('morning'); check(ev('S.phase') === 'delivered' && ev('S.ledger.some(l => l.date === TMR)'), 'morning run completes and charges are recorded');
    const tmrLedger = ev('S.ledger.filter(l => l.date === TMR).length'), feedN = ev('S.feed.length');
    act('morning'); act('deliver', 'me');
    check(ev('S.ledger.filter(l => l.date === TMR).length') === tmrLedger && ev('S.feed.length') === feedN, 'running the morning run or a delivery twice does not charge twice');
    const delivered = ev("S.orders.find(o => o.status === 'delivered').id"); act('oadv', String(delivered));
    check(ev(`S.orders.find(o => o.id === ${delivered}).status`) === 'delivered', 'advancing a delivered order does nothing');

    section('Labels and claims');
    act('ctab', 'wallet'); check(/Demo/.test($('#custApp .wc').textContent), 'wallet shows a Demo label');
    act('mtab', 'earn'); check(/Demo/.test($('#merchApp .mcard').textContent), 'earnings shows a Demo label');
    let claimHit = '';
    for (const tab of ['home','shop','orders','sched','wallet','meals']){ act('ctab', tab); const m = custText().match(TIME_CLAIMS); if (m) claimHit += tab + ':' + m[0] + ' '; }
    for (const tab of ['home','orders','today','run','plans','cust','interest','earn']){ act('mtab', tab); const m = $('#merchApp').textContent.match(TIME_CLAIMS); if (m) claimHit += 'merchant ' + tab + ':' + m[0] + ' '; }
    check(!claimHit, 'no unverified delivery times anywhere' + (claimHit ? ' — found ' + claimHit : ''));
    act('mtab', 'orders');

    section('Images and branding');
    await wait(600);
    const imgs = $$('img');
    const broken = imgs.filter(i => !i.complete || i.naturalWidth === 0).map(i => i.getAttribute('src'));
    check(broken.length === 0, `no broken images (${imgs.length} checked)` + (broken.length ? ': ' + broken.join(', ') : ''));
    const logos = $$('.hh-logo, .wm .logo img, .lg2 img');
    if (BRAND){
      act('ctab', 'home'); await wait(200);
      const ls = $$('.hh-logo, .wm .logo img, .lg2 img').filter(i => i.offsetWidth);
      const distorted = ls.filter(i => Math.abs((i.clientWidth / i.clientHeight) - (i.naturalWidth / i.naturalHeight)) > 0.08);
      check(ls.length >= 3 && distorted.length === 0, `logo keeps its aspect ratio in ${ls.length} places`);
      const clipped = ls.filter(i => { const r = i.getBoundingClientRect(), pr = i.parentElement.getBoundingClientRect(); return r.left < pr.left - 1 || r.right > pr.right + 1 || r.top < pr.top - 1 || r.bottom > pr.bottom + 1; });
      check(clipped.length === 0, 'logo is fully visible, not clipped by its badge' + (clipped.length ? ` (${clipped.length} clipped)` : ''));
    } else check(logos.length === 0, 'public demo shows no Vaaradhi logo');

    section('Persistence and duplicates');
    const n = ev('S.orders.length'), phase = ev('S.phase'), nSub = ev('S.subs.length'), nLed = ev('S.ledger.length'), nLines = ev('lines().length');
    for (let i = 0; i < 3; i++){ await load(); w = frame.contentWindow; d = w.document; hook(w); }
    check(w.eval('S.orders.length') === n && w.eval('S.phase') === phase, 'state survives three page reloads');
    check(w.eval('S.subs.length') === nSub && w.eval('S.ledger.length') === nLed && w.eval('lines().length') === nLines, 'reloading creates no duplicate plans, charges or deliveries');
    for (const tab of ['home','shop','orders','sched','wallet','home']) act('ctab', tab);
    check(w.eval('S.subs.length') === nSub && w.eval('lines().length') === nLines, 'navigating between tabs creates no duplicates');
    w.document.body.appendChild(Object.assign(w.document.createElement('button'), {})).remove();
    act('reset');
    check(w.eval('S.phase') === 'open' && w.eval('S.orders.filter(o => o.date === TDY).length') === 5 && w.eval('S.baskets.length') === 1, 'reset restores the starting sample data');

    section('Layout: desktop and phone');
    const overflow = () => { const o = []; if (d.documentElement.scrollWidth > d.documentElement.clientWidth + 1) o.push('page'); $$('.app .body').forEach(b => { if (b.scrollWidth > b.clientWidth + 1) o.push(b.parentElement.id + ' body'); }); return o; };
    for (const tab of ['home','shop','orders','sched','meals']){ act('ctab', tab); const o = overflow(); check(!o.length, `desktop ${tab}: no horizontal overflow` + (o.length ? ' (' + o + ')' : '')); }
    for (const tab of ['home','orders','today','run','plans','cust','interest','earn']){ act('mtab', tab); const o = overflow(); check(!o.length, `desktop merchant ${tab}: no horizontal overflow` + (o.length ? ' (' + o + ')' : '')); }
    act('mtab', 'home');
    frame.style.width = '390px'; frame.style.height = '844px'; await wait(300);
    check(w.matchMedia('(max-width: 899px)').matches && w.getComputedStyle(d.getElementById('cust')).display !== 'none', 'phone width switches to the single-app layout');
    for (const tab of ['home','shop','orders','sched','meals','wallet']){ act('ctab', tab); const o = overflow(); check(!o.length, `phone ${tab}: no horizontal overflow` + (o.length ? ' (' + o + ')' : '')); }
    act('ctab', 'shop'); act('buy-open', 'desi-eggs-6-pcs|now');
    // Measure layout (offsets), not the slide-in animation's transform.
    const appEl = $('#custApp'), fits = el => el.offsetLeft >= 0 && el.offsetLeft + el.offsetWidth <= appEl.clientWidth + 1 && el.offsetTop >= 0 && el.offsetTop + el.offsetHeight <= appEl.clientHeight + 1;
    check(fits($('#custApp .sheet')), 'phone: product sheet fits the screen');
    act('close'); act('cq', 'potato-500-g|1'); act('cart-open');
    const sh2 = $('#custApp .sheet'), foot = $('#custApp .sh-foot');
    check(fits(sh2) && foot.offsetTop + foot.offsetHeight <= sh2.offsetHeight + 1, 'phone: cart sheet and Place order button fit the screen');
    act('close');
    act('ctab', 'meals'); act('meal-open', 'family-breakfast-box');
    check(fits($('#custApp .sheet')) && $('#custApp .sh-foot').offsetTop + $('#custApp .sh-foot').offsetHeight <= $('#custApp .sheet').offsetHeight + 1, 'phone: breakfast preference sheet and its button fit the screen');
    act('close');
    act('view', 'merchant');
    for (const tab of ['home','orders','today','plans','run','earn']){ act('mtab', tab); const o = overflow(); check(!o.length, `phone merchant ${tab}: no horizontal overflow` + (o.length ? ' (' + o + ')' : '')); }
    act('mtab', 'plans'); act('mplan', ev("planRows()[0].s.id"));
    { const ma = $('#merchApp'), msh = $('#merchApp .sheet'); check(msh.offsetLeft >= 0 && msh.offsetLeft + msh.offsetWidth <= ma.clientWidth + 1 && msh.offsetTop + msh.offsetHeight <= ma.clientHeight + 1, 'phone: merchant plan sheet fits the screen'); }
    act('mclose'); act('mtab', 'interest');
    { const o = overflow(); check(!o.length && w.getComputedStyle(d.getElementById('merch')).display !== 'none', 'phone: merchant breakfast-interest screen has no horizontal overflow' + (o.length ? ' (' + o + ')' : '')); }
    act('view', 'customer'); act('mtab', 'orders');
    act('reset');
    frame.style.width = ''; frame.style.height = '';
  } catch (e) { check(false, 'exception: ' + e.message); }
  check(errors.length === 0, 'no uncaught errors or console errors' + (errors.length ? ': ' + errors.join(' | ') : ''));
  const fails = results.filter(r => !r).length;
  document.getElementById('summary').textContent = `${results.length - fails} passed, ${fails} failed`;
  document.title = `smoke: ${results.length - fails}/${results.length}`;
  try { frame.contentWindow.localStorage.clear(); } catch(e) {}
})();
</script>
</body>
</html>
