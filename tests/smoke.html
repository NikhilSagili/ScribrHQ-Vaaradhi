<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Demo smoke tests</title>
<style>body{font:14px/1.5 ui-monospace,Consolas,monospace;margin:16px}#out .FAIL{color:#b00020;font-weight:700}#out .PASS{color:#0a6b2f}iframe{width:1400px;height:900px;border:1px solid #ccc}</style>
</head>
<body>
<h1>Demo smoke tests</h1>
<p>Open with a local server (<code>python -m http.server</code>, then /tests/smoke.html), or headless Chrome with <code>--allow-file-access-from-files</code>. The app's saved state is reset before the run.</p>
<div id="summary">running…</div>
<ol id="out"></ol>
<iframe id="f" title="App under test"></iframe>
<script>
const results = [];
const out = document.getElementById('out');
function check(ok, msg){ results.push(ok); const li = document.createElement('li'); li.className = ok ? 'PASS' : 'FAIL'; li.textContent = (ok ? 'PASS ' : 'FAIL ') + msg; out.appendChild(li); }
const frame = document.getElementById('f');
const wait = ms => new Promise(r => setTimeout(r, ms));
function load(){ return new Promise(res => { frame.onload = () => res(); frame.src = '../index.html?t=' + Date.now(); }); }

(async () => {
  const errors = [];
  await load();
  let w = frame.contentWindow, d = w.document;
  try { w.localStorage.clear(); } catch(e) {}
  await load(); w = frame.contentWindow; d = w.document;
  w.addEventListener('error', e => errors.push(e.message));
  const ev = x => w.eval(x);
  const click = (sel, root) => { const el = (root || d).querySelector(sel); if (!el) throw new Error('missing ' + sel); el.click(); };
  const act = (a, v) => { const b = d.createElement('button'); b.dataset.a = a; if (v != null) b.dataset.v = v; d.body.appendChild(b); b.click(); b.remove(); };

  try {
    // ---- catalogue data
    const cat = w.CATALOGUE;
    check(cat && cat.products.length === 50, `catalogue has 50 products (got ${cat && cat.products.length})`);
    const ids = cat.products.map(p => p.id);
    check(new Set(ids).size === ids.length, 'product ids are unique');
    check(cat.products.every(p => typeof p.price === 'number' && p.price > 0), 'every product has a positive price');
    check(cat.products.every(p => cat.categories.some(c => c.id === p.category)), 'every product category exists');
    check(cat.products.every(p => p.source && p.source.channel === 'EkSecond' && p.source.verifiedOn === '2026-10-28'), 'every product records source EkSecond and verification date');
    check(cat.products.every(p => p.subscription && p.subscription.status === 'proposed-default'), 'eligibility is marked as proposed default on every product');
    check(!cat.products.every(p => p.subscription.eligible), 'not every product is subscription-eligible');
    check(w.MEAL_PLANS && w.MEAL_PLANS.plans.every(p => p.menu === null && p.pricePerServing === null && p.status === 'concept'), 'meal plans are concepts with no menu or price');
    check(w.DEMO_CONFIG.assetMode === 'placeholder', 'public build uses placeholder assets');

    // ---- home rendering
    const cards = d.querySelectorAll('#custApp .pc');
    check(cards.length === 50, `home shows 50 product cards (got ${cards.length})`);
    let priceOk = true;
    cards.forEach(c => { const name = c.querySelector('.pc-name').textContent.trim(); const p = cat.products.find(x => x.name === name); const shown = c.querySelector('.pc-row b').textContent.replace(/[₹,]/g, ''); if (!p || +shown !== p.price) priceOk = false; });
    check(priceOk, 'every card price matches the catalogue');
    check(d.querySelectorAll('#custApp img').length === 0, 'public build shows no product photos (neutral tiles only)');
    const subBtns = d.querySelectorAll('#custApp .pc-sub[data-a="buy-open"]').length;
    const eligibleNow = ev('PRODUCTS.filter(p => subFreqs(p).length).length');
    check(subBtns === eligibleNow, `Subscribe buttons only on products the engine can schedule (${subBtns} = ${eligibleNow})`);
    check(d.querySelectorAll('#custApp .pc-sub.off').length === 50 - eligibleNow, 'other products are labelled one-time purchase');

    // ---- search and category
    const q = d.getElementById('q'); q.value = 'oil'; q.dispatchEvent(new w.Event('input', {bubbles:true}));
    const hits = [...d.querySelectorAll('#custApp .pc-name')].map(x => x.textContent);
    check(hits.length === 6 && hits.every(h => /oil/i.test(h)), `search "oil" returns the 6 oils (got ${hits.length})`);
    const q2 = d.getElementById('q'); q2.value = 'zzz'; q2.dispatchEvent(new w.Event('input', {bubbles:true}));
    const q3 = d.getElementById('q'); q3.value = ''; q3.dispatchEvent(new w.Event('input', {bubbles:true}));
    check(d.querySelectorAll('#custApp .pc').length === 50, 'clearing the search shows all products again');
    q3.value = 'zzz';
    { const q4 = d.getElementById('q'); q4.value = 'zzz'; q4.dispatchEvent(new w.Event('input', {bubbles:true})); }
    check(!!d.querySelector('#custApp .empty'), 'search with no match shows an empty state');
    { const q5 = d.getElementById('q'); q5.value = ''; q5.dispatchEvent(new w.Event('input', {bubbles:true})); }
    act('cat', 'Millets');
    check(d.querySelectorAll('#custApp .pc').length === 3, 'Millets category shows 3 products');
    act('cat', 'All');

    // ---- cart maths and checkout
    act('cq', 'sunflower-oil-1-litre|1'); act('cq', 'sunflower-oil-1-litre|1'); act('cq', 'desi-eggs-6-pcs|1');
    check(ev('orderAmt(S.cart)') === 495*2 + 150, `cart total 2 × ₹495 + ₹150 = ₹1,140 (got ${ev('orderAmt(S.cart)')})`);
    check(/₹1,140/.test(d.querySelector('#custApp .cartbar').textContent), 'cart bar shows ₹1,140');
    act('cq', 'desi-eggs-6-pcs|-1');
    check(ev('S.cart.length') === 1 && ev('orderAmt(S.cart)') === 990, 'removing the last unit drops the item from the cart');
    act('cq', 'desi-eggs-6-pcs|1');
    const ordersBefore = ev('S.orders.length'), balBefore = ev('balance()');
    act('cart-open'); click('#custApp [data-a="place"]');
    check(ev('S.orders.length') === ordersBefore + 1, 'placing the order creates one order');
    const last = ev('S.orders[S.orders.length-1]');
    check(last.amt === 1140 && last.status === 'placed', 'new order is ₹1,140 and waiting for acceptance');
    check(ev('balance()') <= balBefore - 1140 + 3000 && ev('S.ledger.some(l => l.amt === -1140)'), 'wallet records a ₹1,140 debit');
    check(d.querySelector('#merchApp').textContent.includes('#' + last.id), 'merchant Orders tab shows the new order');
    act('oadv', String(last.id));
    check(ev(`S.orders.find(o => o.id === ${last.id}).status`) === 'accepted', 'merchant can accept the order');

    // ---- eligibility in the product sheet
    act('buy-open', 'mango-pickle-300-g|sub');
    check(ev('ui.sheet.mode') === 'now' && !d.querySelector('#custApp .modes [data-v="sub"]'), 'non-eligible product has no Subscribe option');
    act('close');
    act('buy-open', 'apple-500-g|sub');
    const freqBtns = [...d.querySelectorAll('#custApp [data-a="s-freq"]')].map(b => b.dataset.v);
    check(JSON.stringify(freqBtns) === JSON.stringify(['alternate','weekdays','weekends']), `apple offers only its proposed, supported frequencies (${freqBtns})`);

    // ---- subscription flows to merchant prep
    const prepBefore = ev("prep()['apple-500-g'] || 0");
    click('#custApp [data-a="sub-go"]');
    const prepAfter = ev("prep()['apple-500-g'] || 0");
    check(prepAfter === prepBefore + 1, `new apple subscription adds 1 to tomorrow's prep sheet (${prepBefore} → ${prepAfter})`);

    // ---- vacation pauses my deliveries
    const myOk = () => ev("lines().filter(l => l.cust === 'me' && l.status === 'ok').length");
    check(myOk() > 0, 'demo customer has deliveries tomorrow');
    act('vac-open'); click('#custApp [data-a="vac-go"]');
    check(myOk() === ev("lines().filter(l => l.cust === 'me' && l.kind === 'extra').length"), 'vacation pauses all plan deliveries for tomorrow');
    act('vac-end');

    // ---- lock and morning run
    act('lock'); check(ev('S.phase') === 'locked', '9 PM lock works');
    act('morning'); check(ev('S.phase') === 'delivered', 'morning run completes');
    check(ev("S.ledger.some(l => l.date === TMR)"), 'delivery charges are written to the wallet');

    // ---- demo labels
    act('ctab', 'wallet'); check(/Demo/.test(d.querySelector('#custApp .wc').textContent), 'wallet shows a Demo label');
    act('mtab', 'earn'); check(/Demo/.test(d.querySelector('#merchApp .mcard').textContent), 'earnings shows a Demo label');

    // ---- persistence
    const n = ev('S.orders.length'), phase = ev('S.phase');
    await load(); w = frame.contentWindow; d = w.document;
    check(w.eval('S.orders.length') === n && w.eval('S.phase') === phase, 'state survives a page reload');
    act('reset');
    check(w.eval('S.phase') === 'open' && w.eval('S.orders.length') === 5, 'reset restores the starting sample data');
  } catch (e) { check(false, 'exception: ' + e.message); }
  check(errors.length === 0, 'no uncaught errors' + (errors.length ? ': ' + errors.join(' | ') : ''));
  const fails = results.filter(r => !r).length;
  document.getElementById('summary').textContent = `${results.length - fails} passed, ${fails} failed`;
  document.title = `smoke: ${results.length - fails}/${results.length}`;
  try { w.localStorage.clear(); } catch(e) {}
})();
</script>
</body>
</html>
