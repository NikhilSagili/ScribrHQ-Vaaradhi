<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Demo smoke tests</title>
<style>body{font:14px/1.5 ui-monospace,Consolas,monospace;margin:16px}#out .FAIL{color:#b00020;font-weight:700}#out .PASS{color:#0a6b2f}#out .SECTION{list-style:none;font-weight:700;margin-top:10px}iframe{width:1400px;height:900px;border:1px solid #ccc}</style>
</head>
<body>
<h1>Demo smoke tests</h1>
<p>Open with a local server (<code>python -m http.server</code>, then /tests/smoke.html), or headless Chrome with <code>--allow-file-access-from-files</code>. Works in the public demo and in the local meeting copy. The app's saved state is reset before and after the run.</p>
<div id="summary">running…</div>
<ol id="out"></ol>
<iframe id="f" title="App under test"></iframe>
<script>
const results = [];
const out = document.getElementById('out');
function check(ok, msg){ results.push(!!ok); const li = document.createElement('li'); li.className = ok ? 'PASS' : 'FAIL'; li.textContent = (ok ? 'PASS ' : 'FAIL ') + msg; out.appendChild(li); }
function section(t){ const li = document.createElement('li'); li.className = 'SECTION'; li.textContent = '— ' + t; out.appendChild(li); }
const frame = document.getElementById('f');
const wait = ms => new Promise(r => setTimeout(r, ms));
function load(){ return new Promise(res => { frame.onload = () => res(); frame.src = '../index.html?t=' + Date.now(); }); }
const TIME_CLAIMS = /\b45\s*(min|mins)\b|\b6:30\b|\b7 ?AM\b|\b20 min\b|\b5:00 AM\b|\b6:00 AM\b|\b8:00 AM\b/i;

(async () => {
  const errors = [];
  await load();
  let w = frame.contentWindow, d = w.document;
  try { w.localStorage.clear(); } catch(e) {}
  await load(); w = frame.contentWindow; d = w.document;
  const hook = win => { win.addEventListener('error', e => errors.push(e.message)); const ce = win.console.error; win.console.error = (...a) => { errors.push('console.error: ' + a.join(' ')); ce.apply(win.console, a); }; };
  hook(w);
  const ev = x => w.eval(x);
  const $ = (sel, root) => (root || d).querySelector(sel);
  const $$ = (sel, root) => [...(root || d).querySelectorAll(sel)];
  const click = sel => { const el = $(sel); if (!el) throw new Error('missing ' + sel); el.click(); };
  const act = (a, v) => { const b = d.createElement('button'); b.dataset.a = a; if (v != null) b.dataset.v = v; d.body.appendChild(b); b.click(); b.remove(); };
  const type = (id, val) => { const el = d.getElementById(id); el.value = val; el.dispatchEvent(new w.Event('input', {bubbles:true})); };
  const custText = () => $('#custApp').textContent;
  const BRAND = w.DEMO_CONFIG.assetMode === 'brand';

  try {
    section(`Configuration (${BRAND ? 'LOCAL MEETING COPY, brand assets' : 'PUBLIC demo, placeholders'})`);
    const cat = w.CATALOGUE;
    check(cat && cat.products.length === 50, `catalogue has 50 products (got ${cat && cat.products.length})`);
    const ids = cat.products.map(p => p.id);
    check(new Set(ids).size === ids.length, 'product ids are unique');
    check(cat.products.every(p => typeof p.price === 'number' && p.price > 0), 'every product has a positive price');
    check(cat.products.every(p => cat.categories.some(c => c.id === p.category)), 'every product category exists');
    check(cat.products.every(p => p.source && p.source.channel === 'EkSecond' && p.source.verifiedOn === '2026-10-28'), 'every product records source EkSecond and verification date');
    check(cat.products.every(p => p.subscription && p.subscription.status === 'proposed-default'), 'eligibility is marked as proposed default on every product');
    check(!cat.products.every(p => p.subscription.eligible), 'not every product is subscription-eligible');
    check(w.MEAL_PLANS && w.MEAL_PLANS.plans.every(p => p.menu === null && p.pricePerServing === null && p.status === 'concept'), 'meal plans are concepts with no menu or price');
    check(w.DEMO_CONFIG.subscriptionCutoff === '21:00' && ev('CUTOFF') === '9 PM', `provisional cutoff comes from config (${w.DEMO_CONFIG.subscriptionCutoff} → ${ev('CUTOFF')})`);
    if (BRAND) check(w.DEMO_CONFIG.brandAssets.logo && Object.keys(w.DEMO_CONFIG.brandAssets.productImages).length > 0, 'meeting copy has logo and product photos configured');
    else check(w.DEMO_CONFIG.assetMode === 'placeholder' && !w.DEMO_CONFIG.brandAssets.logo, 'public build uses placeholder assets and no logo');

    section('Home');
    check(ev('ui.cTab') === 'home', 'customer app opens on Home');
    check(custText().includes('Healthy habits, made easier.'), 'hero message is shown');
    const entries = $$('#custApp .entries .entry').map(b => b.dataset.v);
    check(JSON.stringify(entries) === JSON.stringify(['meals','shop','orders']), `three entry points: Healthy Meal Plans, Shop Groceries, Order Again (${entries})`);
    check(/Healthy Meal Plans/.test(custText()) && /Shop Groceries/.test(custText()) && /Order Again/.test(custText()), 'entry point labels are visible');
    check($$('#custApp .rail .pc').length === w.DEMO_CONFIG.homeEssentials.length, `everyday essentials row shows ${w.DEMO_CONFIG.homeEssentials.length} catalogue products`);
    check($$('#custApp .catgrid .cg').length === 16, 'category grid shows all 16 categories');
    check(!$('#custApp .hb') && $$('#custApp .sec-h').length === 2, 'old long list of category rows is gone');
    check(!!$('#custApp .tstrip'), 'tomorrow strip links to the schedule');

    section('Navigation');
    for (const [tab, head] of [['shop','Shop groceries'],['orders','Orders'],['sched','Your schedule'],['wallet','Wallet'],['home','Healthy habits']]){
      click(`#custApp .nav [data-v="${tab}"]`);
      check(ev('ui.cTab') === tab && custText().includes(head), `bottom nav opens ${tab}`);
    }
    click('#custApp .entries [data-v="meals"]');
    check(ev('ui.cTab') === 'meals' && $$('#custApp .mp').length === 4, 'Healthy Meal Plans entry opens the concept preview with 4 plans');
    click('#custApp .back');
    check(ev('ui.cTab') === 'home', 'back button returns to Home');
    click('#custApp .entries [data-v="orders"]');
    check(ev('ui.cTab') === 'orders' && custText().includes('Saved baskets'), 'Order Again entry opens saved baskets and previous orders');
    act('ctab', 'home'); click('#custApp .sfake');
    check(ev('ui.cTab') === 'shop' && d.activeElement && d.activeElement.id === 'q', 'Home search opens Shop with the search box focused');

    section('Shop, search and categories');
    act('clear-filters');
    const cards = $$('#custApp .pc');
    check(cards.length === 50, `Shop shows all 50 products (got ${cards.length})`);
    let priceOk = true;
    cards.forEach(c => { const name = c.querySelector('.pc-name').textContent.trim(); const p = cat.products.find(x => x.name === name); const shown = c.querySelector('.pc-row b').textContent.replace(/[₹,]/g, ''); if (!p || +shown !== p.price) priceOk = false; });
    check(priceOk, 'every card price matches the catalogue');
    const eligibleNow = ev('PRODUCTS.filter(p => subFreqs(p).length).length');
    check($$('#custApp .pc-sub[data-a="buy-open"]').length === eligibleNow, `Subscribe only on products the engine can schedule (${eligibleNow})`);
    check($$('#custApp .pc-sub.off').length === 50 - eligibleNow, 'other products are labelled one-time purchase');
    if (BRAND) check($$('#custApp .pc-img img').length === Object.keys(w.DEMO_CONFIG.brandAssets.productImages).length, 'meeting copy shows a photo for every product that has one');
    else check($$('#custApp img').length === 0, 'public demo shows no product photos or logo');
    type('q', 'oil');
    let hits = $$('#custApp .pc-name').map(x => x.textContent);
    check(hits.length === 6 && hits.every(h => /oil/i.test(h)), `search "oil" returns the 6 oils (got ${hits.length})`);
    type('q', 'zzz');
    check(!!$('#custApp .empty') && !!$('#custApp .empty [data-a="clear-filters"]'), 'no-match search shows an empty state with a way out');
    click('#custApp .empty [data-a="clear-filters"]');
    check($$('#custApp .pc').length === 50 && ev('ui.q') === '', 'clearing restores all products');
    click('#custApp .cchip[data-v="Millets"]');
    check($$('#custApp .pc').length === 3, 'Millets chip shows 3 products');
    click('#custApp .fchip');
    check($$('#custApp .pc').length === 0 && !!$('#custApp .empty'), 'Millets + Can subscribe shows the empty state (millets need weekly plans)');
    click('#custApp .cchip[data-v="All"]');
    check($$('#custApp .pc').length === eligibleNow, '"Can subscribe" filter alone shows the eligible products');
    click('#custApp .fchip');
    act('ctab', 'home'); click('#custApp .cg[data-v="Pulses & Dals"]');
    check(ev('ui.cTab') === 'shop' && $$('#custApp .pc').length === 6, 'Home category tile opens Shop filtered to that category');
    act('clear-filters');

    section('Product details');
    act('buy-open', 'desi-eggs-6-pcs|now');
    check(/Desi Eggs/.test($('#custApp .sheet').textContent) && /₹150/.test($('#custApp .sheet').textContent) && /Eggs/.test($('#custApp .ps-cat').textContent), 'product sheet shows name, category and EkSecond price');
    check(!!$('#custApp .modes [data-v="sub"]'), 'eligible product offers Subscribe');
    click('#custApp .modes [data-v="tmr"]');
    check($('#custApp .sheet').textContent.includes(ev('fmtD(TMR)')), 'Tomorrow option names the next delivery date, without a time slot');
    act('close');
    act('buy-open', 'mango-pickle-300-g|sub');
    check(ev('ui.sheet.mode') === 'now' && !$('#custApp .modes [data-v="sub"]') && /one-time purchase/.test($('#custApp .sheet').textContent), 'non-eligible product has no Subscribe option');
    act('close');
    act('buy-open', 'apple-500-g|sub');
    const freqBtns = $$('#custApp [data-a="s-freq"]').map(b => b.dataset.v);
    check(JSON.stringify(freqBtns) === JSON.stringify(['alternate','weekdays','weekends']), `apple offers only its proposed, supported frequencies (${freqBtns})`);
    act('close');

    section('Cart, saved basket and checkout');
    act('ctab', 'shop');
    act('cq', 'sunflower-oil-1-litre|1'); act('cq', 'sunflower-oil-1-litre|1'); act('cq', 'desi-eggs-6-pcs|1');
    check(ev('orderAmt(S.cart)') === 495*2 + 150, `cart total 2 × ₹495 + ₹150 = ₹1,140 (got ${ev('orderAmt(S.cart)')})`);
    check(/₹1,140/.test($('#custApp .cartbar').textContent), 'cart bar shows ₹1,140');
    act('cq', 'desi-eggs-6-pcs|-1');
    check(ev('S.cart.length') === 1 && ev('orderAmt(S.cart)') === 990, 'removing the last unit drops the item');
    act('cq', 'desi-eggs-6-pcs|1');
    click('#custApp .cartbar');
    check(ev('ui.sheet.type') === 'cart' && $$('#custApp .sheet .row').length === 2, 'cart sheet lists both items');
    check(/Demo/.test($('#custApp .sheet').textContent) && /Same-day delivery/.test($('#custApp .sheet').textContent), 'cart shows same-day delivery and a Demo label on payment');
    type('bname', 'Weekly basics');
    click('#custApp [data-a="save-basket"]');
    check(ev('S.baskets.length') === 2 && ev('S.baskets[1].name') === 'Weekly basics' && ev('orderAmt(S.baskets[1].items)') === 1140, 'cart saved as basket "Weekly basics" (₹1,140)');
    act('cart-open');
    const ordersBefore = ev('S.orders.length');
    click('#custApp [data-a="place"]');
    check(ev('S.orders.length') === ordersBefore + 1, 'placing the order creates one order');
    const last = ev('S.orders[S.orders.length-1]');
    check(last.amt === 1140 && last.status === 'placed' && last.date === ev('TDY'), 'new order is ₹1,140, dated today, awaiting acceptance');
    check(ev('S.ledger.some(l => l.amt === -1140)'), 'wallet records a ₹1,140 debit');
    check(ev('ui.cTab') === 'orders' && /Waiting for Vaaradhi/.test(custText()), 'customer lands on Orders with live tracking');
    check($('#merchApp').textContent.includes('#' + last.id), 'merchant Orders tab shows the new order');
    act('oadv', String(last.id));
    check(ev(`S.orders.find(o => o.id === ${last.id}).status`) === 'accepted' && /Order accepted/.test(custText()), 'merchant accepts and the customer tracker updates');

    section('Order Again');
    act('ctab', 'orders');
    check($$('#custApp .bk').length === 2, 'two saved baskets listed');
    check($$('#custApp [data-a="reorder"]').length === 2, 'two previous orders with Reorder');
    click('#custApp [data-a="basket-cart"][data-v="b1"]');
    check(ev('ui.sheet.type') === 'cart' && ev('orderAmt(S.cart)') === ev("orderAmt(S.baskets.find(b => b.id === 'b1').items)"), 'one tap adds the saved basket to the cart with matching total');
    ev('S.cart = []'); act('close');
    click('#custApp [data-a="reorder"][data-v="1024"]');
    check(JSON.stringify(ev('S.cart')) === JSON.stringify(ev('S.orders.find(o => o.id === 1024).items')), 'Reorder copies the previous order into the cart');
    ev('S.cart = []'); act('close');
    click('#custApp [data-a="del-basket"]');
    check(ev('S.baskets.length') === 2 && /Tap to delete/.test(custText()), 'deleting a basket asks for a second tap');
    click('#custApp [data-a="del-basket"]');
    check(ev('S.baskets.length') === 1, 'second tap deletes the basket');

    section('Healthy Meal Plans (concept)');
    act('ctab', 'meals');
    const mps = $$('#custApp .mp');
    check(mps.length === 4 && mps.every(m => /Menu and pricing to be confirmed/.test(m.textContent)), 'all 4 plans say "Menu and pricing to be confirmed"');
    check(mps.every(m => !/₹/.test(m.textContent)), 'no prices on plan cards');
    check(/Concept preview/.test(custText()), 'screen is labelled as a concept preview');
    click('#custApp [data-a="meal-interest"][data-v="healthy-start"]');
    check(ev("S.interest['healthy-start']") === true && $('#custApp [data-v="healthy-start"]').getAttribute('aria-pressed') === 'true', 'registering interest works');
    check(ev("S.feed[0].text").includes('Healthy Start concept'), 'merchant feed records the interest');

    section('Subscriptions before the cutoff');
    act('ctab', 'sched');
    const eggsSub = ev("S.subs.find(s => s.cust === 'me' && s.prod === 'desi-eggs-6-pcs').id");
    act('t-skip', eggsSub);
    check(ev(`lines().find(l => l.subId === '${eggsSub}').status`) === 'skipped', 'before cutoff: skipping tomorrow works');
    act('t-skip', eggsSub);
    check(ev(`lines().find(l => l.subId === '${eggsSub}').status`) === 'ok', 'before cutoff: undo skip works');
    act('ctab', 'shop'); act('buy-open', 'apple-500-g|sub');
    const prepBefore = ev("prep()['apple-500-g'] || 0");
    click('#custApp [data-a="sub-go"]');
    check(ev("prep()['apple-500-g'] || 0") === prepBefore + 1, "new apple subscription adds 1 to tomorrow's prep sheet");
    const myOk = () => ev("lines().filter(l => l.cust === 'me' && l.status === 'ok').length");
    act('vac-open'); click('#custApp [data-a="vac-go"]');
    check(myOk() === ev("lines().filter(l => l.cust === 'me' && l.kind === 'extra').length"), 'vacation pauses all plan deliveries for tomorrow');
    act('vac-end');

    section('Subscriptions after the cutoff');
    act('lock'); check(ev('S.phase') === 'locked', 'cutoff passes (demo lock)');
    act('ctab', 'sched');
    act('t-skip', eggsSub);
    const next = ev(`nextEligible(S.subs.find(s => s.id === '${eggsSub}'))`);
    check(ev('ui.sheet && ui.sheet.type') === 'cutoff', 'after cutoff: skip shows the cutoff message instead');
    check($('#custApp .sheet').textContent.includes('closed at 9 PM') && $('#custApp .sheet').textContent.includes(ev(`fmtD('${next}')`)), `message names the cutoff and the next eligible date (${next})`);
    check(ev(`lines().find(l => l.subId === '${eggsSub}').status`) === 'ok', "tomorrow's delivery is unchanged");
    click('#custApp [data-a="skip-date"]');
    check(ev(`S.subs.find(s => s.id === '${eggsSub}').skips.includes('${next}')`) && /Skipping/.test(custText()), 'customer can skip the next eligible date instead');
    act('t-qty', eggsSub + '|1');
    check(ev('ui.sheet && ui.sheet.type') === 'cutoff' && ev(`lines().find(l => l.subId === '${eggsSub}').qty`) === 1, 'after cutoff: quantity change is blocked with the same message');
    act('close');
    act('ctab', 'orders'); click('#custApp [data-a="reorder"]');
    check(ev('S.cart.length') === 0, 'after cutoff: reorder is disabled (same-day ordering closed)');
    act('morning'); check(ev('S.phase') === 'delivered' && ev('S.ledger.some(l => l.date === TMR)'), 'morning run completes and charges are recorded');

    section('Labels and claims');
    act('ctab', 'wallet'); check(/Demo/.test($('#custApp .wc').textContent), 'wallet shows a Demo label');
    act('mtab', 'earn'); check(/Demo/.test($('#merchApp .mcard').textContent), 'earnings shows a Demo label');
    let claimHit = '';
    for (const tab of ['home','shop','orders','sched','wallet','meals']){ act('ctab', tab); const m = custText().match(TIME_CLAIMS); if (m) claimHit += tab + ':' + m[0] + ' '; }
    for (const tab of ['orders','today','run','cust','earn']){ act('mtab', tab); const m = $('#merchApp').textContent.match(TIME_CLAIMS); if (m) claimHit += 'merchant ' + tab + ':' + m[0] + ' '; }
    check(!claimHit, 'no unverified delivery times anywhere' + (claimHit ? ' — found ' + claimHit : ''));
    act('mtab', 'orders');

    section('Images and branding');
    await wait(600);
    const imgs = $$('img');
    const broken = imgs.filter(i => !i.complete || i.naturalWidth === 0).map(i => i.getAttribute('src'));
    check(broken.length === 0, `no broken images (${imgs.length} checked)` + (broken.length ? ': ' + broken.join(', ') : ''));
    const logos = $$('.hh-logo, .wm .logo img, .lg2 img');
    if (BRAND){
      act('ctab', 'home'); await wait(200);
      const ls = $$('.hh-logo, .wm .logo img, .lg2 img').filter(i => i.offsetWidth);
      const distorted = ls.filter(i => Math.abs((i.clientWidth / i.clientHeight) - (i.naturalWidth / i.naturalHeight)) > 0.08);
      check(ls.length >= 3 && distorted.length === 0, `logo keeps its aspect ratio in ${ls.length} places`);
      const clipped = ls.filter(i => { const r = i.getBoundingClientRect(), pr = i.parentElement.getBoundingClientRect(); return r.left < pr.left - 1 || r.right > pr.right + 1 || r.top < pr.top - 1 || r.bottom > pr.bottom + 1; });
      check(clipped.length === 0, 'logo is fully visible, not clipped by its badge' + (clipped.length ? ` (${clipped.length} clipped)` : ''));
    } else check(logos.length === 0, 'public demo shows no Vaaradhi logo');

    section('Persistence');
    const n = ev('S.orders.length'), phase = ev('S.phase');
    await load(); w = frame.contentWindow; d = w.document; hook(w);
    check(w.eval('S.orders.length') === n && w.eval('S.phase') === phase, 'state survives a page reload');
    w.document.body.appendChild(Object.assign(w.document.createElement('button'), {})).remove();
    act('reset');
    check(w.eval('S.phase') === 'open' && w.eval('S.orders.filter(o => o.date === TDY).length') === 5 && w.eval('S.baskets.length') === 1, 'reset restores the starting sample data');

    section('Layout: desktop and phone');
    const overflow = () => { const o = []; if (d.documentElement.scrollWidth > d.documentElement.clientWidth + 1) o.push('page'); $$('.app .body').forEach(b => { if (b.scrollWidth > b.clientWidth + 1) o.push(b.parentElement.id + ' body'); }); return o; };
    for (const tab of ['home','shop','orders','sched','meals']){ act('ctab', tab); const o = overflow(); check(!o.length, `desktop ${tab}: no horizontal overflow` + (o.length ? ' (' + o + ')' : '')); }
    frame.style.width = '390px'; frame.style.height = '844px'; await wait(300);
    check(w.matchMedia('(max-width: 899px)').matches && w.getComputedStyle(d.getElementById('cust')).display !== 'none', 'phone width switches to the single-app layout');
    for (const tab of ['home','shop','orders','sched','meals','wallet']){ act('ctab', tab); const o = overflow(); check(!o.length, `phone ${tab}: no horizontal overflow` + (o.length ? ' (' + o + ')' : '')); }
    act('ctab', 'shop'); act('buy-open', 'desi-eggs-6-pcs|now');
    // Measure layout (offsets), not the slide-in animation's transform.
    const appEl = $('#custApp'), fits = el => el.offsetLeft >= 0 && el.offsetLeft + el.offsetWidth <= appEl.clientWidth + 1 && el.offsetTop >= 0 && el.offsetTop + el.offsetHeight <= appEl.clientHeight + 1;
    check(fits($('#custApp .sheet')), 'phone: product sheet fits the screen');
    act('close'); act('cq', 'potato-500-g|1'); act('cart-open');
    const sh2 = $('#custApp .sheet'), foot = $('#custApp .sh-foot');
    check(fits(sh2) && foot.offsetTop + foot.offsetHeight <= sh2.offsetHeight + 1, 'phone: cart sheet and Place order button fit the screen');
    act('close'); act('reset');
    frame.style.width = ''; frame.style.height = '';
  } catch (e) { check(false, 'exception: ' + e.message); }
  check(errors.length === 0, 'no uncaught errors or console errors' + (errors.length ? ': ' + errors.join(' | ') : ''));
  const fails = results.filter(r => !r).length;
  document.getElementById('summary').textContent = `${results.length - fails} passed, ${fails} failed`;
  document.title = `smoke: ${results.length - fails}/${results.length}`;
  try { frame.contentWindow.localStorage.clear(); } catch(e) {}
})();
</script>
</body>
</html>
